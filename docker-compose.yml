services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: deals_bigdata
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-root}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d deals_bigdata"]
      interval: 5s
      timeout: 5s
      retries: 30

  pipeline:
    build: .
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: deals_bigdata
      DB_USER: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD:-root}
      DB_RAW_SCHEMA: raw
      DB_CORE_SCHEMA: core
      DB_MART_SCHEMA: mart
      N_PRICES: ${N_PRICES:-300000}
    depends_on:
      db:
        condition: service_healthy
    command: ["bash", "/app/docker/run_all.sh"]

volumes:
  pgdata:
